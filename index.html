<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoutePilot – Carte de la tournée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
<style>
:root{--navy:#101D32;--blue:#3478F6;--sky:#60A5FA;--bg:#F4F7FC;--line:#E1E8F3;--muted:#64748B;--ok:#16A34A;--bad:#DC2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font:400 15px/1.45 Inter,system-ui,sans-serif}
body.lock{overflow:hidden}
.panel{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:600;margin:0 0 12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search{position:relative;flex:1 1 260px}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.search input{width:100%;height:42px;padding:0 12px 0 38px;border:1px solid var(--line);border-radius:10px;background:#fff}
#results{position:absolute;z-index:5;left:0;right:0;top:46px;margin:0;padding:4px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(16,29,50,.12)}
#results button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:6px}
#results button:hover{background:var(--bg)}
#results small{display:block;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px}
.seg button{border:0;background:none;padding:0 12px;height:34px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#dfe7f3}
.wrap.small{height:240px}.wrap.normal{height:min(60vh,460px)}
.wrap.full{position:fixed;inset:0;z-index:40;border:0;border-radius:0;height:auto}
#map{position:absolute;inset:0}
#exit{position:absolute;z-index:3;left:12px;top:calc(12px + env(safe-area-inset-top,0px));height:38px;padding:0 14px;border:0;border-radius:10px;background:var(--navy);color:#fff}
#msg{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:10px;background:var(--navy);color:#fff;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:10px;align-items:center;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat span{display:block;color:var(--muted);font-size:12.5px}.stat b{font-size:17px;font-weight:600}
.primary{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:500}
.ghost{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.danger{color:var(--bad)}
#list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
#list li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#list .who{min-width:0}#list .who b,#list .who span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .who span{color:var(--muted);font-size:13.5px}
.acts{display:flex;gap:6px}
.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
.pin{width:30px;height:30px;padding:0;border:2px solid #fff;border-radius:50%;background:var(--blue);color:#fff;font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(16,29,50,.35)}
.pin.done{background:var(--ok)}.pin.issue{background:var(--bad)}
.badge{display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:var(--blue);color:#fff;font-weight:600;font-size:13px}
.badge.done{background:var(--ok)}.badge.issue{background:var(--bad)}
.pop{font-family:Inter,sans-serif;color:var(--navy)}.pop p{margin:2px 0}.pop .muted{color:var(--muted);font-size:12.5px}
.pop .acts{margin-top:8px}
dialog{border:0;border-radius:14px;padding:20px;width:min(92vw,400px);box-shadow:0 20px 60px rgba(16,29,50,.3)}
dialog::backdrop{background:rgba(16,29,50,.45)}
dialog h2{font-size:17px;margin:0 0 12px}
dialog label{display:block;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
dialog input,dialog select{display:block;width:100%;height:40px;margin-top:4px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog .acts{justify-content:flex-end;margin-top:14px}
@media(max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.stats .primary{grid-column:1/-1}}
</style>
</head>
<body>
<main class="panel">
  <h1>Carte de la tournée</h1>
  <div class="bar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Ajouter un arrêt : rechercher une adresse" autocomplete="off" aria-label="Rechercher une adresse">
      <ul id="results" hidden></ul>
    </div>
    <div class="seg" role="group" aria-label="Taille de la carte">
      <button type="button" data-mode="small" aria-pressed="false">Réduite</button>
      <button type="button" data-mode="normal" aria-pressed="true">Normale</button>
      <button type="button" data-mode="full" aria-pressed="false">Plein écran</button>
    </div>
  </div>

  <div id="wrap" class="wrap normal">
    <div id="map"></div>
    <button id="exit" type="button" hidden>Quitter le plein écran</button>
    <div id="msg" role="status" hidden></div>
  </div>

  <div class="stats">
    <div class="stat"><span>Arrêts</span><b id="s-count">0</b></div>
    <div class="stat"><span>Distance</span><b id="s-dist">–</b></div>
    <div class="stat"><span>Durée de conduite</span><b id="s-time">–</b></div>
    <button id="opt" class="primary" type="button">Optimiser la tournée</button>
  </div>

  <ol id="list"></ol>
</main>

<dialog id="dlg">
  <form id="f">
    <h2>Modifier l’arrêt</h2>
    <label>Nom du client<input id="f-name" required></label>
    <label>Adresse<input id="f-addr" required></label>
    <label>Heure estimée<input id="f-eta" type="time"></label>
    <label>Statut<select id="f-status"><option value="pending">À faire</option><option value="done">Livré</option><option value="issue">Incident</option></select></label>
    <div class="acts"><button type="button" class="ghost" id="f-cancel">Annuler</button><button class="primary" type="submit">Enregistrer</button></div>
  </form>
</dialog>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
<script>
/* Clé publique Mapbox (pk.…). Restreignez-la à votre domaine Vercel dans le tableau de bord Mapbox. */
const MAPBOX_TOKEN = "";

const LYON = [4.8322, 45.7749]; // Croix-Rousse
const STATUS = { pending: "À faire", done: "Livré", issue: "Incident" };
const KEY = "routepilot:stops";
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

let stops = [];
try { stops = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
let markers = [], styleReady = false, routeData = null, routeSeq = 0, editing = null, toastT;

/* ---------- Carte ---------- */
const ready = MAPBOX_TOKEN.startsWith("pk.");
let map = null;
if (ready) {
  mapboxgl.accessToken = MAPBOX_TOKEN;
  map = new mapboxgl.Map({ container: "map", style: "mapbox://styles/mapbox/light-v11", center: LYON, zoom: 14.5 });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "top-right");
  map.addControl(new mapboxgl.GeolocateControl({ trackUserLocation: false }), "top-right");
  map.on("load", () => { styleReady = true; putRoute(); });
  map.on("error", e => { if (e.error && e.error.status === 401) notify("Clé Mapbox refusée. Vérifiez la clé et les URL autorisées."); });
} else {
  notify("Ajoutez votre clé publique Mapbox dans MAPBOX_TOKEN pour afficher la carte.", true);
}

function notify(text, sticky) {
  const m = $("#msg"); m.textContent = text; m.hidden = false;
  clearTimeout(toastT); if (!sticky) toastT = setTimeout(() => (m.hidden = true), 5000);
}

/* ---------- Itinéraire ---------- */
function putRoute() {
  if (!map || !styleReady) return;
  const data = { type: "Feature", geometry: routeData || { type: "LineString", coordinates: [] } };
  const src = map.getSource("route");
  if (src) return src.setData(data);
  map.addSource("route", { type: "geojson", data });
  const layout = { "line-cap": "round", "line-join": "round" };
  map.addLayer({ id: "route-casing", type: "line", source: "route", layout, paint: { "line-color": "#fff", "line-width": 9 } });
  map.addLayer({ id: "route", type: "line", source: "route", layout, paint: { "line-color": "#3478F6", "line-width": 5 } });
}
function setStats(route) {
  $("#s-count").textContent = stops.length;
  $("#s-dist").textContent = route ? (route.distance / 1000).toFixed(1) + " km" : "–";
  const min = route ? Math.round(route.duration / 60) : null;
  $("#s-time").textContent = min === null ? "–" : min >= 60 ? Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0") : min + " min";
}
async function refreshRoute() {
  if (!map) return;
  const seq = ++routeSeq;
  if (stops.length < 2) { routeData = null; putRoute(); return setStats(null); }
  const coords = stops.slice(0, 25).map(s => s.lng + "," + s.lat).join(";");
  try {
    const r = await fetch(`https://api.mapbox.com/directions/v5/mapbox/driving/${coords}?geometries=geojson&overview=full&access_token=${MAPBOX_TOKEN}`);
    const d = await r.json();
    if (seq !== routeSeq) return;
    const route = d.routes && d.routes[0];
    if (!route) throw new Error(d.message || "aucun itinéraire trouvé");
    routeData = route.geometry; putRoute(); setStats(route);
  } catch (e) {
    routeData = null; putRoute(); setStats(null);
    notify("Itinéraire indisponible : " + e.message);
  }
}
async function optimize() {
  if (!map) return;
  if (stops.length < 3) return notify("Ajoutez au moins 3 arrêts pour optimiser la tournée.");
  if (stops.length > 12) return notify("L’optimisation accepte 12 arrêts au maximum.");
  const coords = stops.map(s => s.lng + "," + s.lat).join(";");
  try {
    const r = await fetch(`https://api.mapbox.com/optimized-trips/v1/mapbox/driving/${coords}?source=first&destination=last&roundtrip=false&access_token=${MAPBOX_TOKEN}`);
    const d = await r.json();
    if (d.code !== "Ok") throw new Error(d.message || d.code);
    stops = d.waypoints.map((w, i) => ({ s: stops[i], p: w.waypoint_index })).sort((a, b) => a.p - b.p).map(x => x.s);
    commit(); notify("Tournée optimisée : le premier arrêt reste le départ.");
  } catch (e) { notify("Optimisation impossible : " + e.message); }
}

/* ---------- Arrêts ---------- */
function commit(fit) {
  try { localStorage.setItem(KEY, JSON.stringify(stops)); } catch (e) {}
  render(); refreshRoute();
  if (fit) fitStops();
  const api = window.RoutePilotMap;
  if (api && typeof api.onChange === "function") api.onChange(structuredClone(stops));
}
function fitStops() {
  if (!map || !stops.length) return;
  if (stops.length === 1) return map.flyTo({ center: [stops[0].lng, stops[0].lat], zoom: 15.5 });
  const b = new mapboxgl.LngLatBounds();
  stops.forEach(s => b.extend([s.lng, s.lat]));
  map.fitBounds(b, { padding: 70, maxZoom: 16, duration: 600 });
}
function actions(s) {
  const box = el("div", "acts");
  const e = el("button", "ghost", "Modifier"); e.type = "button"; e.onclick = () => edit(s.id);
  const d = el("button", "ghost danger", "Supprimer"); d.type = "button";
  d.onclick = () => { stops = stops.filter(x => x.id !== s.id); commit(); };
  box.append(e, d); return box;
}
function popup(s, i) {
  const b = el("div", "pop");
  b.append(el("b", null, (i + 1) + ". " + (s.name || "Client sans nom")), el("p", null, s.address),
    el("p", "muted", s.lat.toFixed(5) + ", " + s.lng.toFixed(5)),
    el("p", null, "Statut : " + STATUS[s.status]), el("p", null, "Arrivée estimée : " + (s.eta || "non définie")), actions(s));
  return b;
}
function render() {
  markers.forEach(m => m.remove()); markers = [];
  const list = $("#list"); list.replaceChildren();
  if (!stops.length) list.append(Object.assign(el("li", "empty", "Aucun arrêt pour l’instant. Recherchez une adresse pour ajouter le premier."), {}));
  stops.forEach((s, i) => {
    if (map) {
      const pin = el("button", "pin " + s.status, String(i + 1)); pin.type = "button"; pin.setAttribute("aria-label", "Arrêt " + (i + 1));
      markers.push(new mapboxgl.Marker({ element: pin }).setLngLat([s.lng, s.lat])
        .setPopup(new mapboxgl.Popup({ offset: 18, maxWidth: "260px" }).setDOMContent(popup(s, i))).addTo(map));
    }
    const li = el("li"), who = el("div", "who");
    who.append(el("b", null, s.name || "Client sans nom"), el("span", null, s.address), el("span", null, STATUS[s.status] + (s.eta ? " – " + s.eta : "")));
    li.append(el("span", "badge " + s.status, String(i + 1)), who, actions(s));
    list.append(li);
  });
  $("#s-count").textContent = stops.length;
}
function edit(id) {
  const s = stops.find(x => x.id === id); if (!s) return;
  editing = id;
  $("#f-name").value = s.name; $("#f-addr").value = s.address; $("#f-eta").value = s.eta; $("#f-status").value = s.status;
  $("#dlg").showModal();
}
$("#f").addEventListener("submit", e => {
  e.preventDefault();
  const s = stops.find(x => x.id === editing); if (!s) return;
  Object.assign(s, { name: $("#f-name").value.trim(), address: $("#f-addr").value.trim(), eta: $("#f-eta").value, status: $("#f-status").value });
  $("#dlg").close(); commit();
});
$("#f-cancel").onclick = () => $("#dlg").close();

/* ---------- Recherche d’adresses ---------- */
let searchT, searchSeq = 0;
const results = $("#results");
$("#q").addEventListener("input", e => {
  clearTimeout(searchT);
  const q = e.target.value.trim();
  if (q.length < 3 || !map) { results.hidden = true; return; }
  searchT = setTimeout(() => search(q), 300);
});
async function search(q) {
  const seq = ++searchSeq;
  try {
    const r = await fetch(`https://api.mapbox.com/search/geocode/v6/forward?q=${encodeURIComponent(q)}&country=fr&language=fr&limit=5&proximity=${LYON}&access_token=${MAPBOX_TOKEN}`);
    const d = await r.json();
    if (seq !== searchSeq) return;
    results.replaceChildren();
    (d.features || []).forEach(f => {
      const li = el("li"), b = el("button"); b.type = "button";
      b.append(el("span", null, f.properties.name), el("small", null, f.properties.place_formatted || ""));
      b.onclick = () => addStop(f);
      li.append(b); results.append(li);
    });
    results.hidden = !results.children.length;
  } catch (e) { notify("Recherche indisponible : " + e.message); }
}
function addStop(f) {
  const [lng, lat] = f.geometry.coordinates, p = f.properties;
  const s = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: "", address: p.full_address || p.name, lat, lng, status: "pending", eta: "" };
  stops.push(s); $("#q").value = ""; results.hidden = true;
  commit(true); edit(s.id);
}

/* ---------- Taille de la carte ---------- */
function setMode(m) {
  $("#wrap").className = "wrap " + m;
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  $("#exit").hidden = m !== "full";
  document.body.classList.toggle("lock", m === "full");
  if (map) { map.resize(); setTimeout(() => map.resize(), 200); }
}
document.querySelectorAll("[data-mode]").forEach(b => (b.onclick = () => setMode(b.dataset.mode)));
$("#exit").onclick = () => setMode("normal");
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#exit").hidden) setMode("normal"); });
$("#opt").onclick = optimize;

/* ---------- Intégration : window.RoutePilotMap ---------- */
window.RoutePilotMap = {
  getStops: () => structuredClone(stops),
  setStops: arr => { stops = arr; commit(true); },
  onChange: null
};

render(); setStats(null); $("#s-count").textContent = stops.length;
if (map) { refreshRoute(); map.once("load", fitStops); }
</script>
</body>
</html>
